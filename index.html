<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>O Segredo na Ilha</title>

    <script type="module"
        src="https://pyscript.net/releases/2025.3.1/core.js">
    </script>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        #jogo-container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
            text-align: center;
        }

        h1 {
            font-size: 36px;
        }

        #imagem-fase {
            width: 100%;
            max-height: 450px;
            object-fit: cover;
            border-radius: 15px;
            display: none;
            margin-bottom: 20px;
        }

        #jogo {
            background: #1d1d1d;
            padding: 20px;
            border-radius: 15px;
            text-align: left;
            max-height: 500px;
            overflow-y: auto;
        }

        .texto-jogo {
            white-space: pre-wrap;
            font-size: 17px;
            line-height: 1.5;
        }

        #status {
            background: #252525;
            padding: 12px;
            border-radius: 10px;
            margin: 15px 0;
            font-weight: bold;
        }

        #botoes {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .opcao {
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            background: #444;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .opcao:hover {
            transform: scale(1.03);
        }
    </style>
</head>

<body>

    <div id="jogo-container">

        <h1>🏝️ O Segredo na Ilha</h1>

        <img id="imagem-fase" src="" alt="Imagem da fase">

        <div id="status"></div>

        <div id="jogo"></div>

        <div id="botoes"></div>

    </div>


    <!-- CARREGA O JOGO -->
    <script type="py" src="jogo.py?v=999"></script>


    <!-- REMOVE QUALQUER BOTÃO "CONTINUAR" -->
    <script>

        const observador = new MutationObserver(() => {

            const botoes = document.querySelectorAll("#botoes button");

            botoes.forEach(botao => {

                const texto = botao.innerText
                    .trim()
                    .toLowerCase();

                if (
                    texto.includes("continuar") ||
                    texto.includes("➡️ continuar") ||
                    texto.includes("➡ continuar")
                ) {
                    botao.remove();
                }

            });

        });


        observador.observe(
            document.body,
            {
                childList: true,
                subtree: true
            }
        );

    </script>

</body>

</html>
