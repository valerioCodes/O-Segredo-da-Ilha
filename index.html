<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>O Segredo na Ilha</title>

    <script type="module"
        src="https://pyscript.net/releases/2025.3.1/core.js">
    </script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        #jogo-container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
            text-align: center;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        #imagem-fase {
            width: 100%;
            max-height: 450px;
            object-fit: cover;
            border-radius: 15px;
            display: none;
            margin-bottom: 20px;
        }

        #status {
            background: #252525;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            font-weight: bold;
            text-align: center;
        }

        #jogo {
            background: #1d1d1d;
            padding: 25px;
            border-radius: 15px;
            text-align: left;
            min-height: 250px;
            max-height: 500px;
            overflow-y: auto;
        }

        .texto-jogo {
            white-space: pre-wrap;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        #botoes {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        .opcao {
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            background: #444;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .opcao:hover {
            transform: scale(1.04);
            background: #666;
        }

        .titulo-fase {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .final {
            text-align: center;
        }

    </style>

</head>

<body>

    <div id="jogo-container">

        <h1>🏝️ O Segredo na Ilha</h1>

        <img
            id="imagem-fase"
            src=""
            alt="Imagem da fase"
        >

        <div id="status"></div>

        <div id="jogo"></div>

        <div id="botoes"></div>

    </div>

    <script type="py" src="jogo.py"></script>

</body>

</html>
