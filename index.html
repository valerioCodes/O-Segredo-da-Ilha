<style>

    body {
        margin: 0;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
    }

    #jogo-container {
        width: 90%;
        max-width: 900px;
        margin: 30px auto;
        text-align: center;
    }

    h1 {
        font-size: 36px;
        margin-bottom: 20px;
    }

    /* =========================
       MÚSICA
    ========================= */

    #musica-controle {
        margin: 20px 0;
    }

    #botao-musica {
        padding: 12px 22px;
        border: none;
        border-radius: 10px;
        background: #444;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    #botao-musica:hover {
        background: #555;
        transform: scale(1.03);
    }

    /* =========================
       IMAGEM
    ========================= */

    #imagem-fase {
        width: 100%;
        max-height: 450px;
        object-fit: cover;
        border-radius: 15px;
        display: none;
        margin-bottom: 20px;
    }

    /* =========================
       JOGO
    ========================= */

    #jogo {
        background: #1d1d1d;
        padding: 20px;
        border-radius: 15px;
        text-align: left;
        max-height: 500px;
        overflow-y: auto;
    }

    .texto-jogo {
        white-space: pre-wrap;
        font-family: Arial, sans-serif;
        font-size: 17px;
        line-height: 1.5;
        margin-bottom: 10px;
    }

    /* =========================
       STATUS
    ========================= */

    #status {
        background: #252525;
        padding: 12px;
        border-radius: 10px;
        margin: 15px 0;
        font-weight: bold;
    }

    /* =========================
       BOTÕES
    ========================= */

    #botoes {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        margin-top: 20px;
    }

    .opcao {
        padding: 14px 20px;
        border: none;
        border-radius: 10px;
        background: #444;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    .opcao:hover {
        background: #555;
        transform: scale(1.03);
    }

</style>

</head>

<body>

<div id="jogo-container">

```
<h1>🏝️ O Segredo na Ilha</h1>


<!-- =========================
     MÚSICA
========================== -->

<div id="musica-controle">

    <button
        id="botao-musica"
        type="button">

        🎵 Tocar música

    </button>


    <audio
        id="musica"
        loop
        preload="auto">

        <source
            src="./musica.mp3"
            type="audio/mpeg">

    </audio>

</div>


<!-- =========================
     IMAGEM
========================== -->

<img
    id="imagem-fase"
    src=""
    alt="Imagem da fase">


<!-- =========================
     STATUS
========================== -->

<div id="status"></div>


<!-- =========================
     JOGO
========================== -->

<div id="jogo"></div>


<!-- =========================
     BOTÕES
========================== -->

<div id="botoes"></div>
```

</div>

<!-- =========================
     TESTE DA MÚSICA
========================= -->

<script>

    const botaoMusica =
        document.getElementById("botao-musica");

    const musica =
        document.getElementById("musica");


    botaoMusica.addEventListener(
        "click",
        async function () {

            console.log(
                "Tentando tocar:",
                musica.currentSrc
            );


            try {

                if (musica.paused) {

                    await musica.play();

                    botaoMusica.innerText =
                        "🔇 Pausar música";

                    console.log(
                        "Música começou!"
                    );

                }

                else {

                    musica.pause();

                    botaoMusica.innerText =
                        "🎵 Tocar música";

                }

            }

            catch (erro) {

                console.error(
                    "ERRO DA MÚSICA:",
                    erro
                );

                alert(
                    "ERRO DA MÚSICA:\n\n" +
                    erro.name +
                    "\n\n" +
                    erro.message +
                    "\n\nArquivo usado:\n" +
                    musica.currentSrc
                );

            }

        }
    );


    /* Verifica se o navegador encontrou o arquivo */

    musica.addEventListener(
        "loadeddata",
        function () {

            console.log(
                "✅ Arquivo de música encontrado!"
            );

        }
    );


    musica.addEventListener(
        "error",
        function () {

            console.error(
                "❌ O navegador não conseguiu carregar musica.mp3"
            );

        }
    );

</script>
