<style>
    body {
        margin: 0;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
    }

    #jogo-container {
        width: 90%;
        max-width: 900px;
        margin: 30px auto;
        text-align: center;
    }

    h1 {
        font-size: 36px;
    }

    #imagem-fase {
        width: 100%;
        max-height: 450px;
        object-fit: cover;
        border-radius: 15px;
        display: none;
        margin-bottom: 20px;
    }

    #jogo {
        background: #1d1d1d;
        padding: 20px;
        border-radius: 15px;
        text-align: left;
        max-height: 500px;
        overflow-y: auto;
    }

    .texto-jogo {
        white-space: pre-wrap;
        font-family: Arial, sans-serif;
        font-size: 17px;
        line-height: 1.5;
    }

    #status {
        background: #252525;
        padding: 12px;
        border-radius: 10px;
        margin: 15px 0;
        font-weight: bold;
    }

    #botoes {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        margin-top: 20px;
    }

    .opcao {
        padding: 14px 20px;
        border: none;
        border-radius: 10px;
        background: #444;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    .opcao:hover {
        transform: scale(1.03);
    }

    #musica-controle {
        margin: 15px 0;
    }

    #botao-musica {
        padding: 12px 20px;
        border: none;
        border-radius: 10px;
        background: #444;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    #botao-musica:hover {
        transform: scale(1.03);
    }

</head>

<body>

```
<div id="jogo-container">

    <h1>🏝️ O Segredo na Ilha</h1>

    <div id="musica-controle">
        <button id="botao-musica" onclick="tocarMusica()">
            🎵 Tocar música
        </button>

        <audio id="musica" loop>
            <source src="musica.mp3" type="audio/mpeg">
        </audio>
    </div>

    <img id="imagem-fase" src="" alt="Imagem da fase">

    <div id="status"></div>

    <div id="jogo"></div>

    <div id="botoes"></div>

</div>

<script>
    function tocarMusica() {
        const musica = document.getElementById("musica");
        const botao = document.getElementById("botao-musica");

        if (musica.paused) {
            musica.play();
            botao.innerText = "🔇 Pausar música";
        } else {
            musica.pause();
            botao.innerText = "🎵 Tocar música";
        }
    }
</script>

<script type="py" src="jogo.py"></script>
