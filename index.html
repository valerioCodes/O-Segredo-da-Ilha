<div id="jogo-container">

    <h1>🏝️ O Segredo na Ilha</h1>

    <!-- MÚSICA -->
    <div id="musica-controle">

        <button id="botao-musica">
            🎵 Tocar música
        </button>

        <audio id="musica" loop preload="auto">
            <source src="./m%C3%BAsica.mp3" type="audio/mpeg">
        </audio>

    </div>

    <!-- IMAGEM -->
    <img id="imagem-fase" src="" alt="Imagem da fase">

    <!-- STATUS -->
    <div id="status"></div>

    <!-- TEXTO DO JOGO -->
    <div id="jogo"></div>

    <!-- BOTÕES DAS ESCOLHAS -->
    <div id="botoes"></div>

</div>

<script>
    const botaoMusica = document.getElementById("botao-musica");
    const musica = document.getElementById("musica");

    botaoMusica.addEventListener("click", async function () {

        try {

            if (musica.paused) {

                await musica.play();

                botaoMusica.innerText = "🔇 Pausar música";

            } else {

                musica.pause();

                botaoMusica.innerText = "🎵 Tocar música";

            }

        } catch (erro) {

            console.error("Erro ao tocar música:", erro);

            alert(
                "Não consegui tocar a música. " +
                "Confira se o arquivo música.mp3 está no GitHub."
            );

        }

    });
</script>

<!-- JOGO PYTHON -->
<script type="py" src="./jogo.py"></script>
